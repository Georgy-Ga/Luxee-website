# ============================================
# Luxee Project - nginx Configuration
# ============================================
# Скопируй этот файл в C:\nginx\conf\luxee.conf
# Затем добавь в C:\nginx\conf\nginx.conf строку: include luxee.conf;

# Upstream для backend (Docker на порту 5001)
upstream backend {
    server 127.0.0.1:5001;
}

# Upstream для frontend (Docker на порту 8080)
upstream frontend {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    
    # Для Cloudflare Tunnel: server_name не важен (cloudflared обращается по localhost)
    # Для Direct Access: укажи свой домен или IP
    server_name localhost 127.0.0.1;

    # Увеличиваем размер тела запроса (для загрузки файлов)
    client_max_body_size 100M;

    # Frontend - главная страница и статика
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API - все запросы /api/*
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты для API
        proxy_connect_timeout 90s;
        proxy_send_timeout 90s;
        proxy_read_timeout 90s;
    }

    # WebSocket для Socket.io
    location /socket.io {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Таймауты для WebSocket (долгие соединения)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    # Логи
    access_log C:/nginx/logs/luxee-access.log;
    error_log C:/nginx/logs/luxee-error.log;
}
