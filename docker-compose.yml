services:
  # MongoDB
  mongodb:
    image: mongo:4.4
    container_name: luxee-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    ports:
      - "27017:27017"
    networks:
      - luxee-network
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: luxee-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DOCKER: "true"
      MONGO_URL: mongodb://${MONGO_ROOT_USERNAME:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/luxee?authSource=admin
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      # AI Configuration (Omniroute)
      AI_API_URL: ${AI_API_URL:-http://host.docker.internal:20128/v1}
      AI_API_KEY: ${AI_API_KEY}
      AI_MODEL: ${AI_MODEL:-gemini-cli/gemini-2.5-flash}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:80,http://localhost}
      # Spambot Service
      SPAMBOT_URL: http://luxee-spambot:8001
    ports:
      - "5001:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      spambot:
        condition: service_started
    networks:
      - luxee-network
    volumes:
      # Сохранение данных браузера Playwright
      - playwright_data:/app/.playwright
      - browser_contexts:/app/browser-contexts
      # 🆕 Монтируем папку с промптами профилей
      - ./backend/prompts:/app/prompts
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Spambot Service (Python)
  spambot:
    build:
      context: ./backend-spambot
      dockerfile: Dockerfile
    container_name: luxee-spambot
    restart: unless-stopped
    environment:
      SPAMBOT_PORT: 8001
      SPAMBOT_HOST: 0.0.0.0
      NODE_BACKEND_URL: http://backend:5000
      HIDDEN_BROWSER: "true"
      SKIP_SENDING_MESSAGE: "false"
    ports:
      - "8001:8001"
    networks:
      - luxee-network
    volumes:
      - spambot_logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: luxee-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - luxee-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  luxee-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  playwright_data:
    driver: local
  browser_contexts:
    driver: local
  spambot_logs:
    driver: local
