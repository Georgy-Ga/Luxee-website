# ============================================
# Luxee Project - Server nginx Configuration
# ============================================
# Скопируй этот файл на сервер в /etc/nginx/sites-available/luxee
# Затем выполни: sudo ln -s /etc/nginx/sites-available/luxee /etc/nginx/sites-enabled/

# Upstream для backend (Docker на порту 5001)
upstream backend {
    server 127.0.0.1:5001;
    keepalive 32;
}

# Upstream для frontend (Docker на порту 8080)
upstream frontend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# Сервер для домена diamond-agencystudio.com
server {
    listen 80;
    server_name diamond-agencystudio.com www.diamond-agencystudio.com;

    # Увеличиваем размер тела запроса (для загрузки файлов)
    client_max_body_size 100M;

    # Логи
    access_log /var/log/nginx/luxee-access.log;
    error_log /var/log/nginx/luxee-error.log;

    # Frontend - главная страница и статика
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Backend API - все запросы /api/*
    location /api {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Таймауты для API (увеличены для spambot: login + парсинг профилей)
        proxy_connect_timeout 320s;
        proxy_send_timeout 320s;
        proxy_read_timeout 320s;
    }

    # WebSocket для Socket.io
    location /socket.io {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        # Таймауты для WebSocket (долгие соединения)
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }
}

